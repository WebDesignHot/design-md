name: Validate catalog PR

on:
  pull_request:
    paths:
      - 'design-md/**.md'
      - 'SPEC.md'

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate the complete catalog
        run: npx -y @webdesignhot/design-md@0.5.5 lint design-md --strict
